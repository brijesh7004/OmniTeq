<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero-Config Hardware & Firmware Project Tracker</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --line-color: #e2e8f0;
            
            /* Status Colors */
            --color-completed: #2ecc71;
            --color-current: #3498db;
            --color-pending: #bdc3c7;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-section {
            width: 100%;
            max-width: 1200px;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--line-color);
            padding-bottom: 15px;
        }

        .header-title {
            margin: 0;
            font-size: 1.6rem;
            font-weight: 700;
            color: #1a252f;
        }

        .dashboard-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 35px;
        }

        .project-card {
            background: var(--card-bg);
            padding: 35px 40px 45px 40px;
            border-radius: 14px;
            box-shadow: 0 4px 25px rgba(160, 174, 192, 0.15);
        }

        .project-title {
            margin-top: 0;
            margin-bottom: 35px;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            border-left: 5px solid var(--color-current);
            padding-left: 12px;
        }

        .progress-container {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-top: 20px;
        }

        .progress-container::before {
            content: '';
            position: absolute;
            top: 22px;
            left: 0;
            height: 4px;
            width: 100%;
            background-color: var(--line-color);
            z-index: 1;
        }

        .progress-line-fill {
            position: absolute;
            top: 22px;
            left: 0;
            height: 4px;
            background-color: var(--color-completed);
            z-index: 1;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0%;
        }

        .step {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            text-align: center;
            padding: 0 8px;
        }

        .step-node {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #fff;
            border: 4px solid var(--color-pending);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            color: var(--text-muted);
            transition: all 0.4s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .step-label {
            margin-top: 14px;
            font-weight: 600;
            font-size: 13.5px;
            line-height: 1.3;
            color: var(--text-main);
        }

        .step-subtext {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 5px;
            font-weight: 400;
            max-width: 130px;
        }

        .step.completed .step-node {
            border-color: var(--color-completed);
            background-color: var(--color-completed);
            color: white;
        }

        .step.current .step-node {
            border-color: var(--color-current);
            background-color: white;
            color: var(--color-current);
            transform: scale(1.15);
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.35);
        }

        .step.current .step-label {
            color: var(--color-current);
            font-weight: 700;
        }
    </style>

    <script src="./project_status.js"></script>
</head>
<body>

    <div class="header-section">
        <h1 class="header-title">Project Engineering Pipelines</h1>
    </div>

    <div class="dashboard-container" id="dashboard">
        </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // Check if our external js data loaded successfully
            if (typeof projectsData !== 'undefined') {
                buildDashboard(projectsData);
            } else {
                document.getElementById('dashboard').innerHTML = 
                    `<div style="color: #9b1c1c; background: #fde8e8; padding: 20px; border-radius: 8px; text-align:center; font-weight:600;">
                        Error: Could not find 'projectsData' variable. Make sure 'project_status.js' exists in this folder and is properly formatted.
                     </div>`;
            }
        });

        function buildDashboard(dataArray) {
            const dashboard = document.getElementById('dashboard');
            dashboard.innerHTML = '';

            dataArray.forEach((project, pIndex) => {
                const card = document.createElement('div');
                card.classList.add('project-card');

                const title = document.createElement('h2');
                title.classList.add('project-title');
                title.innerText = project.projectName;
                card.appendChild(title);

                const progressContainer = document.createElement('div');
                progressContainer.classList.add('progress-container');
                
                const fillLine = document.createElement('div');
                fillLine.classList.add('progress-line-fill');
                fillLine.id = `fill-line-${pIndex}`;
                progressContainer.appendChild(fillLine);

                let completedCount = 0;
                const totalSteps = project.steps.length;

                project.steps.forEach((step) => {
                    const stepEl = document.createElement('div');
                    stepEl.classList.add('step', step.status);

                    if (step.status === 'completed') {
                        completedCount++;
                    } else if (step.status === 'current') {
                        completedCount += 0.5;
                    }

                    const nodeIcon = step.status === 'completed' ? '✓' : step.id;

                    stepEl.innerHTML = `
                        <div class="step-node">${nodeIcon}</div>
                        <div class="step-label">${step.label}</div>
                        <div class="step-subtext">${step.subtext || ''}</div>
                    `;
                    progressContainer.appendChild(stepEl);
                });

                card.appendChild(progressContainer);
                dashboard.appendChild(card);

                const fillPercentage = totalSteps > 1 ? ((completedCount - 0.5) / (totalSteps - 1)) * 100 : 0;
                const safePercentage = Math.min(Math.max(fillPercentage, 0), 100);

                setTimeout(() => {
                    const el = document.getElementById(`fill-line-${pIndex}`);
                    if (el) el.style.width = `${safePercentage}%`;
                }, 100 + (pIndex * 80));
            });
        }
    </script>
</body>
</html>
