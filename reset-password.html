<!DOCTYPE html>
<html lang="en" class="dark-theme">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - OmniTeq</title>
    <!-- Favicon -->
    <link rel="icon" href="images/logo/favicon.svg" type="image/svg+xml">
    <!-- CSS Files -->
    <link rel="stylesheet" href="css/style.css?v=3.6">
    <link rel="stylesheet" href="css/responsive.css?v=2.0">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body>
    <!-- Header Section -->
    <header id="header">
        <div class="container">
            <div class="logo">
                <a href="index.html">
                    <img src="images/logo/logo.svg" alt="OmniTeq Logo - Smart Solutions for a Connected World"
                        id="navbar-logo">
                    <script>if (localStorage.getItem('theme') === 'light') document.getElementById('navbar-logo').src = 'images/logo/logo-white.svg';</script>
                </a>
            </div>

            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="resources.html">Resources</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

            <div class="nav-actions">
                <button class="theme-toggle" aria-label="Toggle dark mode" id="theme-toggle">
                    <i class="fas fa-sun"></i>
                    <i class="fas fa-moon"></i>
                </button>
                <a href="login.html" class="nav-auth-link active">Login</a>
                <a href="register.html" class="nav-auth-btn">Register</a>
                <a href="lets-talk.html" class="cta-button">Let's Talk</a>
                <div class="hamburger" id="hamburger">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </div>
            </div>
        </div>
    </header>

    <div class="login-container">
        <div class="login-left">
            <i class="fas fa-user-shield"></i>
            <div class="login-welcome">
                <h1>Set New Password</h1>
                <p>Choose a strong, unique password to secure your OmniTeq account.</p>
            </div>
        </div>
        <div class="login-right">
            <form class="login-box" id="reset-password-form">
                <div class="login-title">Create New Password</div>
                <div class="mb-3">
                    <label for="password" class="form-label">New Password</label>
                    <input type="password" class="form-control" id="password" name="password"
                        placeholder="Min. 8 characters" required>
                </div>
                <div class="mb-4">
                    <label for="confirm_password" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                        placeholder="Repeat new password" required>
                </div>
                <button type="submit" class="login-btn">Save Password</button>
            </form>
        </div>
    </div>

    <!-- JavaScript Files -->
    <script src="js/main.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            window.showToast('Invalid or expired reset link.', 'error');
            setTimeout(() => window.location.href = 'login.html', 3000);
        }

        document.getElementById('reset-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirm_password = document.getElementById('confirm_password').value;

            if (password !== confirm_password) {
                window.showToast('Passwords do not match.', 'error');
                return;
            }

            const btn = e.target.querySelector('button');
            btn.disabled = true;
            btn.textContent = 'Saving...';

            try {
                const resp = await fetch('api/auth/reset_password.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });
                const data = await resp.json();

                if (data.status === 'success') {
                    window.showToast('Password updated successfully! Redirecting...', 'success');
                    setTimeout(() => window.location.href = 'login.html', 2000);
                } else {
                    window.showToast(data.message || 'Reset failed.', 'error');
                }
            } catch (err) {
                window.showToast('Server error. Please try again.', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Save Password';
            }
        });
    </script>
</body>

</html>
