<!DOCTYPE html>
<html lang="en" class="dark-theme">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - OmniTeq</title>
    <!-- Favicon -->
    <link rel="icon" href="images/logo/favicon.svg" type="image/svg+xml">
    <!-- CSS Files -->
    <link rel="stylesheet" href="css/style.css?v=3.6">
    <link rel="stylesheet" href="css/responsive.css?v=2.0">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            if (savedTheme === 'dark') document.documentElement.classList.add('dark-theme');
        })();
    </script>
</head>

<body>
    <!-- Header Section -->
    <header id="header">
        <div class="container">
            <div class="logo">
                <a href="index.html">
                    <img src="images/logo/logo.svg" alt="OmniTeq Logo - Smart Solutions for a Connected World"
                        id="navbar-logo">
                    <script>if (localStorage.getItem('theme') === 'light') document.getElementById('navbar-logo').src = 'images/logo/logo-white.svg';</script>
                </a>
            </div>

            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="resources.html">Resources</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

            <div class="nav-actions">
                <button class="theme-toggle" aria-label="Toggle dark mode" id="theme-toggle">
                    <i class="fas fa-sun"></i>
                    <i class="fas fa-moon"></i>
                </button>
                <a href="login.html" class="nav-auth-link">Login</a>
                <a href="register.html" class="nav-auth-btn">Register</a>
                <a href="lets-talk.html" class="cta-button">Let's Talk</a>
                <div class="hamburger" id="hamburger">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </div>
            </div>
        </div>
    </header>

    <div class="login-container">
        <div class="login-left">
            <i class="fas fa-key"></i>
            <div class="login-welcome">
                <h1>Forgot Password?</h1>
                <p>No worries! Enter your email and we'll send you a link to reset it.</p>
            </div>
        </div>
        <div class="login-right">
            <form class="login-box" id="forgot-password-form">
                <div class="login-title">Reset Your Password</div>
                <div class="mb-4">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" name="email"
                        placeholder="Enter your registered email" required>
                </div>
                <button type="submit" class="login-btn">Send Reset Link</button>
                <div class="login-footer">
                    Remembered it? <a href="login.html">Back to Login</a>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Files -->
    <script src="js/main.js"></script>
    <script>
        document.getElementById('forgot-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.textContent;

            btn.disabled = true;
            btn.textContent = 'Sending...';

            const email = document.getElementById('email').value;

            try {
                const resp = await fetch('api/auth/request_reset.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await resp.json();

                if (data.status === 'success') {
                    window.showToast(data.message, 'success');
                    // For demo, we might show the link or redirect
                } else {
                    window.showToast(data.message || 'Request failed.', 'error');
                }
            } catch (err) {
                window.showToast('Server error. Please try again.', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = originalText;
            }
        });
    </script>
</body>

</html>
